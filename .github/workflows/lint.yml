name: linting
on:
  push:
    branches:
      - master
jobs:
  run-linters:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          stylelint: true
