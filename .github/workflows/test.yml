name: Test-Workflow
on:
  workflow_run:
    workflows: ["linting-workflow"] # Must exactly match the 'name' field of Workflow 1
    types:
      - completed

  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
